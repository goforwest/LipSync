sentence=nRF52 Wire with bounded transactions and wedged-bus recovery, patched by the LipSync firmware project.
paragraph=Forked from the Seeed nRF52 core's bundled Wire (Seeeduino:nrf52@1.1.13). Every TWIM event wait is bounded (50 ms); on timeout the driver runs a bounded STOP plus the NXP I2C bus-clear (up to 9 SCL clocks) and re-enables the peripheral, so a sensor that wedges the bus mid-transaction fails the read instead of hanging the device until its watchdog resets. Without this library the firmware still works and the hardware watchdog recovers a wedged bus in ~30 s; with it the failure is instant and the bus is usually recovered in place.
