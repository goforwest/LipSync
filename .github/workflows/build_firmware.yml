# Builds the LipSync firmware and attaches flashable artifacts to the
# GitHub release for the pushed V* tag:
#   LipSync_Firmware_<version>_dfu.zip   adafruit-nrfutil serial-DFU package
#                                        (flashed by the LipSync Connect web app)
#   LipSync_Firmware_<version>.uf2       UF2 image (bootloader drive drag-and-drop)
#   LipSync_Firmware_<version>.hex       raw Intel HEX
#   firmware-manifest.json               version + sha256 + sizes (update-check
#                                        source of truth for the web app)
#
# The build mirrors the manual process in the Maker Guide: Seeed nRF52 core,
# the library versions listed there, and the sketch compiled for the
# Seeed XIAO nRF52840. The tag must match the version constants in
# LSConfig.h, so a release can never report a version it doesn't contain.

name: Build firmware release artifacts

on:
  push:
    tags:
      - 'V*'
      - 'v*'  # (4.5.7 review) this repo's own history carries lowercase tags (v4.0, v4.0.1) — a lowercase tag used to produce a release with NO artifacts and no manifest, silently
  workflow_dispatch:

env:
  FQBN: Seeeduino:nrf52:xiaonRF52840
  SEEED_BOARD_INDEX: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    # (4.9.9 review round 2) Job-level: the minimum for the release attach and
    # the firmware-binaries push, scoped to the only job that needs it.
    permissions:
      contents: write
    # (4.5.7 review) Two near-simultaneous tags publishing the
    # firmware-binaries branch is a push race; the version guard below is
    # read-then-push, so serialize the publish job as belt-and-braces.
    concurrency:
      group: firmware-binaries-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tracked source ZIP matches the tagged tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          root = Path('Build_Files/Firmware_Files')
          archive = root / 'LipSync_Firmware.zip'
          expected = {
              path.relative_to(root).as_posix(): path
              for folder in ('LipSync_Firmware', 'Libraries')
              for path in (root / folder).rglob('*')
              if path.is_file() and path.name != '.DS_Store'
          }
          problems = []
          try:
              with zipfile.ZipFile(archive) as source_zip:
                  file_names = [name for name in source_zip.namelist() if not name.endswith('/')]
                  actual = set(file_names)
                  for name in sorted({name for name in file_names if file_names.count(name) > 1}):
                      problems.append(f'duplicate in source ZIP: {name}')
                  for name, path in expected.items():
                      if name not in actual:
                          problems.append(f'missing from source ZIP: {name}')
                      elif source_zip.read(name) != path.read_bytes():
                          problems.append(f'stale in source ZIP: {name}')
                  for name in sorted(actual - expected.keys()):
                      problems.append(f'extra in source ZIP: {name}')
          except (FileNotFoundError, zipfile.BadZipFile) as error:
              problems.append(f'cannot read {archive}: {error}')

          if problems:
              print('\n'.join(problems), file=sys.stderr)
              print('Run the Compress Firmware Files workflow and tag its resulting commit.', file=sys.stderr)
              raise SystemExit(1)
          print(f'Source ZIP matches all {len(expected)} sketch/library files.')
          PY

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'

      - name: Install Seeed nRF52 core (pinned)
        run: |
          arduino-cli core update-index --additional-urls "$SEEED_BOARD_INDEX"
          arduino-cli core install Seeeduino:nrf52@1.1.13 --additional-urls "$SEEED_BOARD_INDEX"

      - name: Install libraries (pinned to the Maker Guide set)
        run: |
          arduino-cli lib install \
            "Adafruit BusIO@1.17.4" \
            "Adafruit GFX Library@1.12.6" \
            "Adafruit LPS2X@2.0.6" \
            "Adafruit LPS35HW@1.0.6" \
            "Adafruit SSD1306@2.5.17" \
            "Adafruit TinyUSB Library@3.7.3" \
            "Adafruit Unified Sensor@1.1.15" \
            "ArduinoJson@7.4.3"

      # The vendored libraries (bounded Wire + pressure-driver forks,
      # Bluefruit fault capture, and Infineon's XENSIV TLx493D successor) are
      # pinned into the build by the compile step's --libraries flag, so CI,
      # local builds and releases compile the same source. LPS2X/LPS35HW are
      # still installed above at the declared release versions as a provenance
      # pin, but the byte-matched bounded copies in Libraries/ take precedence.
      #
      # (5.0.1 audit) TinyUSB MUST be pinned here and must match the
      # hardware-validated build: the Seeed core 1.1.13 bundles
      # Adafruit_TinyUSB_Arduino 1.7.0, and on a runner without the user-dir
      # copy the release silently linked THAT ancient stack — every local /
      # Maker-Guide build (user-installed TinyUSB, "latest version 3.4.2+"
      # per the 4.1.0 fix) links the modern one. The two images are not
      # interchangeable builds of the same firmware (the 5.0.0 tag day
      # release differed from every validated build by ~8.5 KB of linked
      # code), and the bench-23 hardware validation ran against the
      # user-library build. 3.7.3 is the exact version the 5.0.0 bench
      # session validated; refresh it together with the Maker Guide's
      # TinyUSB instruction, never leave it to runner state.

      - name: Install adafruit-nrfutil (post-compile DFU packaging)
        run: pip3 install 'adafruit-nrfutil==0.5.3.post16'

      - name: Run the host test suite (ASan/UBSan)
        run: |
          set -o pipefail  # the suites' exit codes must survive the tee below
          # (4.5.7 review) The release notes cite "host suite N/N under
          # ASan/UBSan" as release evidence — this step makes it true in CI
          # instead of by convention: the LSTimer regression suite compiles
          # the REAL LSTimer.h against host shims and fails the build on any
          # check failure.
          # (5.0.1 audit) The suites' CHECK COUNTS are asserted too: exit 0
          # alone cannot see a future edit that drops a test function from
          # main() — the release would go green with a silently smaller
          # suite while CHANGES.txt still cites 385/168. Bump these greps
          # together with the suites themselves.
          c++ -std=c++17 -g -fsanitize=address,undefined \
            -IBuild_Files/Firmware_Files/LipSync_Firmware \
            -IBuild_Files/Firmware_Files/Libraries/Wire \
            -o lstimer_host_tests \
            Build_Files/Firmware_Files/host_tests/lstimer_host_tests.cpp
          ./lstimer_host_tests | tee /tmp/lstimer.out
          grep -q '168 checks, 0 failures' /tmp/lstimer.out
          c++ -std=c++17 -g -fsanitize=address,undefined \
            -IBuild_Files/Firmware_Files/LipSync_Firmware \
            -o core_host_tests \
            Build_Files/Firmware_Files/host_tests/core_host_tests.cpp
          ./core_host_tests | tee /tmp/core.out
          grep -q '408 checks, 0 failures' /tmp/core.out

      - name: Read firmware version and verify the tag matches
        run: |
          VERSION=$(awk '/^#define[ \t]+CONF_LIPSYNC_VERSION_MAJOR/{printf "%s.", $3}
                         /^#define[ \t]+CONF_LIPSYNC_VERSION_MINOR/{printf "%s.", $3}
                         /^#define[ \t]+CONF_LIPSYNC_VERSION_REV/{printf "%s", $3}' \
            Build_Files/Firmware_Files/LipSync_Firmware/LSConfig.h)
          # (4.9.9 review round 2) The awk reads three #define fields and the
          # value is interpolated into python expressions downstream. A
          # malformed define (a macro name, a stray token) must fail the run
          # HERE, shape-checked, rather than crash the publish step's int()
          # parse into its "branch holds newer" branch — a green run that
          # silently skips the branch publish while the release still attaches.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "LSConfig.h version constants did not parse as a plain dotted number (got: '$VERSION'). Check CONF_LIPSYNC_VERSION_MAJOR/MINOR/REV." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#V}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match firmware version $VERSION in LSConfig.h." >&2
              exit 1
            fi
          fi

      - name: Compile firmware
        run: |
          mkdir -p build
          # (release polish) HERMETIC BUILD: the one __FILE__-derived path that
          # survives linkage is the core-bundled Adafruit_LittleFS' absolute
          # path under the Arduino data directory (~/Library/Arduino15 on
          # macOS, ~/.arduino15 on Linux) — it used to differ per builder
          # (~16 bytes of layout shift and a wholly different image hash).
          # Mapping the data directory to a fixed token in every compile step
          # makes the flash image a function of the source alone: a local
          # build and the CI build of the same tree hash identically. The
          # sketch and repo sources compile from RELATIVE paths already (the
          # only absolute prefix is the data dir), so mapping the data dir is
          # sufficient — the workspace map below is belt-and-braces for any
          # future repo-file __FILE__. -ffile-prefix-map needs GCC >= 8; the
          # pinned core 1.1.13 toolchain qualifies.
          # arduino-cli's per-OS default data directory (macOS keeps it under
          # ~/Library/Arduino15, Linux under ~/.arduino15) — computed, not
          # hardcoded, so the same recipe runs on any runner OS.
          case "$(uname -s)" in
            Darwin) ARDUINO_DATA_DIR="${ARDUINO_DATA_DIR:-$HOME/Library/Arduino15}" ;;
            *)      ARDUINO_DATA_DIR="${ARDUINO_DATA_DIR:-$HOME/.arduino15}" ;;
          esac
          MAP_FLAGS="-ffile-prefix-map=$ARDUINO_DATA_DIR=arduino-data"
          if [ -n "${GITHUB_WORKSPACE:-}" ]; then
            MAP_FLAGS="$MAP_FLAGS -ffile-prefix-map=$GITHUB_WORKSPACE=."
          fi
          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings all \
            --build-path build \
            --libraries Build_Files/Firmware_Files/Libraries \
            --build-property "compiler.c.extra_flags=$MAP_FLAGS" \
            --build-property "compiler.cpp.extra_flags=$MAP_FLAGS" \
            --build-property "compiler.S.extra_flags=$MAP_FLAGS" \
            Build_Files/Firmware_Files/LipSync_Firmware

      - name: Generate UF2
        run: |
          # Pinned to the exact microsoft/uf2 revision the local twin
          # (LipSync_Connect dev/firmware/uf2conv.py + uf2families.json)
          # vendored byte-identical, so release artifacts always match the
          # documented local build. Refresh both copies together.
          curl -sL --fail \
            https://raw.githubusercontent.com/microsoft/uf2/90e9741f217f5a40c98ba74d663e408041037578/utils/uf2conv.py \
            -o uf2conv.py
          curl -sL --fail \
            https://raw.githubusercontent.com/microsoft/uf2/90e9741f217f5a40c98ba74d663e408041037578/utils/uf2families.json \
            -o uf2families.json
          printf '%s  %s\n' \
            'ad36ba2d61fb2ea371832262392088281eee474c609df4142adbee4ea3c20f26' uf2conv.py \
            '9d8f561e050507c5909063005cd6f5b157e6fe6db1e8d25b5d9027d57064c194' uf2families.json \
            | sha256sum --check --strict
          python3 uf2conv.py -c -f 0xADA52840 \
            -o "build/LipSync_Firmware_${VERSION}.uf2" \
            "build/LipSync_Firmware.ino.hex"

      - name: Stage release artifacts + manifest
        run: |
          # A release checkout may already contain bench artifacts in dist/.
          # Start clean so gh release upload and the workflow artifact contain
          # exactly this build's three images plus its manifest—not stale stock,
          # recovery, or hardened packages committed by an earlier bench round.
          rm -rf dist
          mkdir -p dist
          cp build/LipSync_Firmware.ino.zip "dist/LipSync_Firmware_${VERSION}_dfu.zip"
          cp build/LipSync_Firmware.ino.hex "dist/LipSync_Firmware_${VERSION}.hex"
          mv "build/LipSync_Firmware_${VERSION}.uf2" dist/
          VERSION="$VERSION" python3 - <<'EOF'
          import datetime
          import hashlib
          import json
          import os
          version = os.environ["VERSION"]
          dist = "dist"
          files = {
              "dfu": f"LipSync_Firmware_{version}_dfu.zip",
              "uf2": f"LipSync_Firmware_{version}.uf2",
              "hex": f"LipSync_Firmware_{version}.hex",
          }
          entry = {}
          for kind, name in files.items():
              with open(os.path.join(dist, name), "rb") as f:
                  data = f.read()
              entry[kind] = {
                  "fileName": name,
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          manifest = {
              "firmwareVersion": version,
              # The tag this build was released from (branch name on
              # workflow_dispatch): lets a stale firmware-binaries branch be
              # diagnosed from the artifact itself — the web app separately
              # refuses a manifest whose version disagrees with the release.
              "tag": os.environ.get("GITHUB_REF_NAME", ""),
              "fqbn": "Seeeduino:nrf52:xiaonRF52840",
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "files": entry,
          }
          with open(os.path.join(dist, "firmware-manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF
          ls -l dist/

      - name: Upload build artifacts (workflow_dispatch / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.VERSION }}
          path: dist/

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/V') || startsWith(github.ref, 'refs/tags/v')  # (4.5.7 review) lowercase tags publish too — the trigger accepts them, so the gates must
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (4.9.9 review round 2) Tolerate ONLY the "release already exists"
          # race (a re-run after a partial publish). A blanket `|| true` also
          # swallowed real API/quota failures; the upload below would catch
          # them eventually, but with a less precise error.
          if ! gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes "Firmware ${VERSION}. See CHANGES.txt for details."; then
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              echo "Release ${GITHUB_REF_NAME} already exists — attaching artifacts to it."
            else
              echo "gh release create failed and the release does not exist." >&2
              exit 1
            fi
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

      # The browser updater cannot fetch release download URLs cross-origin
      # (GitHub serves no CORS headers on that surface), but it CAN read
      # api.github.com — so the flash artifacts are additionally published to
      # a dedicated branch that the app reads through the contents/git-blob
      # endpoints as base64. The branch is force-updated each release: it
      # holds exactly one commit with the current artifacts.
      - name: Publish artifacts to the firmware-binaries branch
        if: startsWith(github.ref, 'refs/tags/V') || startsWith(github.ref, 'refs/tags/v')  # (4.5.7 review) lowercase tags publish too
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stale-race guard: the branch is force-pushed per release, but two
          # near-simultaneous tags can finish in either order — an older build
          # completing last must never clobber a newer release's artifacts
          # (releases/latest would then disagree with the branch, and every
          # update check would report the older version). If the branch
          # already holds a NEWER firmwareVersion than this build, leave it
          # untouched.
          #
          # Residual race (accepted): the check is read-then-push — two builds
          # that both read the branch before either pushes can still finish
          # out of order. The web app's tag↔manifest cross-check refuses a
          # branch that disagrees with releases/latest, so the failure mode is
          # "everyone sees a clear error until the next release", never a
          # wrong flash. Do not rely on this guard for correctness — rely on
          # it to make the common orderings do the right thing.
          #
          # Failure policy: fail CLOSED. A missing branch is the first
          # release (publish); anything unparsable or unreadable is a broken
          # state that must not be published over silently.
          # (4.5.7 review) ls-remote --exit-code exits 2 ONLY for "no matching
          # refs" (the genuine first release); any other non-zero exit is a
          # failed READ and must not take the unconditional first-release
          # push — fail closed instead, per this step's own policy.
          LSR_EXIT=0
          git ls-remote --exit-code origin refs/heads/firmware-binaries >/dev/null 2>&1 || LSR_EXIT=$?
          if [ "$LSR_EXIT" -eq 2 ]; then
            echo "firmware-binaries does not exist yet — publishing ${VERSION} (first release)."
            EXPECTED_REMOTE_SHA=""
          elif [ "$LSR_EXIT" -ne 0 ]; then
            echo "git ls-remote failed (exit ${LSR_EXIT}) — refusing to publish ${VERSION} blind." >&2
            exit 1
          else
            EXPECTED_REMOTE_SHA=$(git ls-remote origin refs/heads/firmware-binaries | cut -f1)
            # (4.9.9 review round 2) A branch deleted between the two probes
            # would leave this empty and fall through to the unconditional
            # recreate push below. That outcome is benign, but fail closed
            # per this step's own policy — a re-run re-probes cleanly.
            if [ -z "$EXPECTED_REMOTE_SHA" ]; then
              echo "firmware-binaries vanished between the two probes — refusing to publish ${VERSION} blind; re-run the build." >&2
              exit 1
            fi
            if ! MANIFEST_B64=$(gh api "repos/${GITHUB_REPOSITORY}/contents/firmware-manifest.json?ref=firmware-binaries" \
              --jq '.content' 2>/dev/null); then
              echo "Could not read firmware-manifest.json from firmware-binaries — refusing to publish ${VERSION} blind." >&2
              exit 1
            fi
            if ! BRANCH_VERSION=$(printf '%s' "$MANIFEST_B64" | base64 -d 2>/dev/null \
              | python3 -c 'import json,sys,re; v=json.load(sys.stdin).get("firmwareVersion",""); print(v); sys.exit(1 if v and not re.fullmatch(r"[Vv]?\d+(\.\d+)*", v) else 0)'); then
              echo "firmware-binaries holds a manifest that is not valid JSON, or a firmwareVersion that is not a plain dotted number — refusing to publish ${VERSION} over it." >&2
              exit 1
            fi
            if [ -z "$BRANCH_VERSION" ]; then
              echo "firmware-binaries holds a manifest with an empty firmwareVersion — refusing to publish ${VERSION} over it." >&2
              exit 1
            fi
            if python3 -c "import sys; sys.exit(0 if [int(p) for p in '${BRANCH_VERSION}'.lstrip('Vv').split('.')] <= [int(p) for p in '${VERSION}'.lstrip('Vv').split('.')] else 1)"; then
              echo "Branch holds ${BRANCH_VERSION}; publishing ${VERSION}."
            else
              echo "firmware-binaries already holds ${BRANCH_VERSION} — newer than this build (${VERSION}); leaving it untouched."
              exit 0
            fi
          fi
          # (4.6.1 release fix) The bench rounds commit the dist artifacts
          # into the branch tree, so the tag checkout carries them as
          # TRACKED files — the fresh staging build above then reads as
          # local modifications and git refuses the orphan switch
          # ("your local changes would be overwritten by checkout"; the
          # V4.5.6 release passed only because its tag tree predated the
          # committed-dist convention). The classic orphan pattern
          # instead: checkout --orphan keeps index and worktree, then the
          # index is emptied with --cached -f — every file stays on disk,
          # the freshly built dist content included, and the commit below
          # stages exactly the four release files. (Verified against the
          # exact sequence in a scratch repo: switch --orphan alone
          # refuses BOTH the modified-tracked and the untracked-leftover
          # shapes.)
          git checkout --orphan firmware-binaries
          git rm -r -q --cached -f .
          mv dist/* .
          git add firmware-manifest.json "LipSync_Firmware_${VERSION}_dfu.zip" "LipSync_Firmware_${VERSION}.uf2" "LipSync_Firmware_${VERSION}.hex"
          git commit -m "Firmware ${VERSION} flash artifacts"
          # (4.5.7 review) --force-with-lease closes the read-then-push race
          # the version guard alone could not: if ANYTHING moved the branch
          # since the guard read it (a concurrent release won the race), this
          # push fails loudly instead of clobbering it.
          if [ -n "$EXPECTED_REMOTE_SHA" ]; then
            git push --force-with-lease="refs/heads/firmware-binaries:${EXPECTED_REMOTE_SHA}" origin HEAD:firmware-binaries
          else
            git push -f origin HEAD:firmware-binaries
          fi
