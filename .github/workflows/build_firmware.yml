# Builds the LipSync firmware and attaches flashable artifacts to the
# GitHub release for the pushed V* tag:
#   LipSync_Firmware_<version>_dfu.zip   adafruit-nrfutil serial-DFU package
#                                        (flashed by the LipSync Connect web app)
#   LipSync_Firmware_<version>.uf2       UF2 image (bootloader drive drag-and-drop)
#   LipSync_Firmware_<version>.hex       raw Intel HEX
#   firmware-manifest.json               version + sha256 + sizes (update-check
#                                        source of truth for the web app)
#
# The build mirrors the manual process in the Maker Guide: Seeed nRF52 core,
# the library versions listed there, and the sketch compiled for the
# Seeed XIAO nRF52840. The tag must match the version constants in
# LSConfig.h, so a release can never report a version it doesn't contain.

name: Build firmware release artifacts

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FQBN: Seeeduino:nrf52:xiaonRF52840
  SEEED_BOARD_INDEX: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'

      - name: Install Seeed nRF52 core (pinned)
        run: |
          arduino-cli core update-index --additional-urls "$SEEED_BOARD_INDEX"
          arduino-cli core install Seeeduino:nrf52@1.1.13 --additional-urls "$SEEED_BOARD_INDEX"

      - name: Install libraries (pinned to the Maker Guide set)
        run: |
          arduino-cli lib install \
            "Adafruit BusIO@1.17.4" \
            "Adafruit GFX Library@1.12.6" \
            "Adafruit LPS2X@2.0.6" \
            "Adafruit LPS35HW@1.0.6" \
            "Adafruit SSD1306@2.5.17" \
            "Adafruit Unified Sensor@1.1.15" \
            "ArduinoJson@7.4.3"

      # The TLV493D library is the vendored fork in
      # Build_Files/Firmware_Files/Libraries/TLV493D-A1B6 — pinned into the
      # build by the compile step's --libraries flag (like the vendored
      # Wire), so CI, local builds and releases all compile the bounded
      # copy. No user-library install needed.

      - name: Install adafruit-nrfutil (post-compile DFU packaging)
        run: pip3 install 'adafruit-nrfutil==0.5.3.post16'

      - name: Read firmware version and verify the tag matches
        run: |
          VERSION=$(awk '/^#define[ \t]+CONF_LIPSYNC_VERSION_MAJOR/{printf "%s.", $3}
                         /^#define[ \t]+CONF_LIPSYNC_VERSION_MINOR/{printf "%s.", $3}
                         /^#define[ \t]+CONF_LIPSYNC_VERSION_REV/{printf "%s", $3}' \
            Build_Files/Firmware_Files/LipSync_Firmware/LSConfig.h)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#V}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match firmware version $VERSION in LSConfig.h." >&2
              exit 1
            fi
          fi

      - name: Compile firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path build \
            --libraries Build_Files/Firmware_Files/Libraries \
            Build_Files/Firmware_Files/LipSync_Firmware

      - name: Generate UF2
        run: |
          # Pinned to the exact microsoft/uf2 revision the local twin
          # (LipSync_Connect dev/firmware/uf2conv.py + uf2families.json)
          # vendored byte-identical, so release artifacts always match the
          # documented local build. Refresh both copies together.
          curl -sL --fail \
            https://raw.githubusercontent.com/microsoft/uf2/90e9741f217f5a40c98ba74d663e408041037578/utils/uf2conv.py \
            -o uf2conv.py
          curl -sL --fail \
            https://raw.githubusercontent.com/microsoft/uf2/90e9741f217f5a40c98ba74d663e408041037578/utils/uf2families.json \
            -o uf2families.json
          python3 uf2conv.py -c -f 0xADA52840 \
            -o "build/LipSync_Firmware_${VERSION}.uf2" \
            "build/LipSync_Firmware.ino.hex"

      - name: Stage release artifacts + manifest
        run: |
          mkdir -p dist
          cp build/LipSync_Firmware.ino.zip "dist/LipSync_Firmware_${VERSION}_dfu.zip"
          cp build/LipSync_Firmware.ino.hex "dist/LipSync_Firmware_${VERSION}.hex"
          mv "build/LipSync_Firmware_${VERSION}.uf2" dist/
          VERSION="$VERSION" python3 - <<'EOF'
          import datetime
          import hashlib
          import json
          import os
          version = os.environ["VERSION"]
          dist = "dist"
          files = {
              "dfu": f"LipSync_Firmware_{version}_dfu.zip",
              "uf2": f"LipSync_Firmware_{version}.uf2",
              "hex": f"LipSync_Firmware_{version}.hex",
          }
          entry = {}
          for kind, name in files.items():
              with open(os.path.join(dist, name), "rb") as f:
                  data = f.read()
              entry[kind] = {
                  "fileName": name,
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          manifest = {
              "firmwareVersion": version,
              # The tag this build was released from (branch name on
              # workflow_dispatch): lets a stale firmware-binaries branch be
              # diagnosed from the artifact itself — the web app separately
              # refuses a manifest whose version disagrees with the release.
              "tag": os.environ.get("GITHUB_REF_NAME", ""),
              "fqbn": "Seeeduino:nrf52:xiaonRF52840",
              "builtAt": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "files": entry,
          }
          with open(os.path.join(dist, "firmware-manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF
          ls -l dist/

      - name: Upload build artifacts (workflow_dispatch / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.VERSION }}
          path: dist/

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/V')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes "Firmware ${VERSION}. See CHANGES.txt for details." || true
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

      # The browser updater cannot fetch release download URLs cross-origin
      # (GitHub serves no CORS headers on that surface), but it CAN read
      # api.github.com — so the flash artifacts are additionally published to
      # a dedicated branch that the app reads through the contents/git-blob
      # endpoints as base64. The branch is force-updated each release: it
      # holds exactly one commit with the current artifacts.
      - name: Publish artifacts to the firmware-binaries branch
        if: startsWith(github.ref, 'refs/tags/V')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stale-race guard: the branch is force-pushed per release, but two
          # near-simultaneous tags can finish in either order — an older build
          # completing last must never clobber a newer release's artifacts
          # (releases/latest would then disagree with the branch, and every
          # update check would report the older version). If the branch
          # already holds a NEWER firmwareVersion than this build, leave it
          # untouched.
          #
          # Residual race (accepted): the check is read-then-push — two builds
          # that both read the branch before either pushes can still finish
          # out of order. The web app's tag↔manifest cross-check refuses a
          # branch that disagrees with releases/latest, so the failure mode is
          # "everyone sees a clear error until the next release", never a
          # wrong flash. Do not rely on this guard for correctness — rely on
          # it to make the common orderings do the right thing.
          #
          # Failure policy: fail CLOSED. A missing branch is the first
          # release (publish); anything unparsable or unreadable is a broken
          # state that must not be published over silently.
          if ! git ls-remote --exit-code origin refs/heads/firmware-binaries >/dev/null 2>&1; then
            echo "firmware-binaries does not exist yet — publishing ${VERSION} (first release)."
          else
            if ! MANIFEST_B64=$(gh api "repos/${GITHUB_REPOSITORY}/contents/firmware-manifest.json?ref=firmware-binaries" \
              --jq '.content' 2>/dev/null); then
              echo "Could not read firmware-manifest.json from firmware-binaries — refusing to publish ${VERSION} blind." >&2
              exit 1
            fi
            if ! BRANCH_VERSION=$(printf '%s' "$MANIFEST_B64" | base64 -d 2>/dev/null \
              | python3 -c 'import json,sys,re; v=json.load(sys.stdin).get("firmwareVersion",""); print(v); sys.exit(1 if v and not re.fullmatch(r"[Vv]?\d+(\.\d+)*", v) else 0)'); then
              echo "firmware-binaries holds a manifest that is not valid JSON, or a firmwareVersion that is not a plain dotted number — refusing to publish ${VERSION} over it." >&2
              exit 1
            fi
            if [ -z "$BRANCH_VERSION" ]; then
              echo "firmware-binaries holds a manifest with an empty firmwareVersion — refusing to publish ${VERSION} over it." >&2
              exit 1
            fi
            if python3 -c "import sys; sys.exit(0 if [int(p) for p in '${BRANCH_VERSION}'.lstrip('Vv').split('.')] <= [int(p) for p in '${VERSION}'.lstrip('Vv').split('.')] else 1)"; then
              echo "Branch holds ${BRANCH_VERSION}; publishing ${VERSION}."
            else
              echo "firmware-binaries already holds ${BRANCH_VERSION} — newer than this build (${VERSION}); leaving it untouched."
              exit 0
            fi
          fi
          git switch --orphan firmware-binaries
          mv dist/* .
          git add firmware-manifest.json "LipSync_Firmware_${VERSION}_dfu.zip" "LipSync_Firmware_${VERSION}.uf2" "LipSync_Firmware_${VERSION}.hex"
          git commit -m "Firmware ${VERSION} flash artifacts"
          git push -f origin HEAD:firmware-binaries
