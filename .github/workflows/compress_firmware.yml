name: Compress Firmware Files

# (4.9.7 review) Contract: keep the tracked source ZIP current by
# bot-committing ONLY when the tree's content actually changed. Two guards
# make that real:
#   1. the archive is rebuilt over fixed mtimes, so a content-identical tree
#      rebuilds with identical entry metadata (entry mtimes used to differ on
#      every run, which made the "already current" guard dead code and turned
#      this job into a bot-commit on every qualifying push — a guaranteed red
#      check on a protected upstream main after the merge). Byte-level
#      determinism additionally depends on the runner's zip/zlib build
#      (readdir traversal order) — which is exactly why guard 2 compares
#      ENTRY CONTENTS rather than archive bytes;
#   2. the commit gate compares ENTRY CONTENTS (names + bytes), the same
#      semantics as build_firmware.yml's release-day source-ZIP gate, so a
#      runner-side zip/zlib version drift cannot manufacture a commit either.
# A push the token cannot update (a protected branch) is tolerated with a
# loud warning: the drift is named here, and build_firmware.yml's fail-closed
# source-ZIP gate remains the backstop that refuses a release built from a
# stale tracked ZIP.

on:
  push:
    branches:
      - '**' # Runs on ALL branches (the v4.1 double-fire caller was removed — 4.5.7 review)
    paths:
      - "Build_Files/Firmware_Files/LipSync_Firmware/**"
      - "Build_Files/Firmware_Files/Libraries/**"
      - ".github/workflows/compress_firmware.yml"
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  compress_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: firmware-source-zip-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # (5.0.1 audit) workflow_dispatch is triggerable from any ref — a
      # dispatch on a TAG ref checks out a detached HEAD, and the push below
      # then fails loudly ("not currently on a branch"). Fail-closed already,
      # so this is clarity, not correctness: name the misfire instead of
      # shipping a red run whose error reads like a push failure.
      - name: Require a branch ref
        if: github.ref_type != 'branch'
        run: |
          echo "::error title=Run on a non-branch ref::workflow_dispatch fired on ref_type=${{ github.ref_type }} ('${{ github.ref_name }}'). The compress bot commits to a branch — dispatch it from a branch." >&2
          exit 1


      - name: Zip Firmware Files
        run: |
          cd Build_Files/Firmware_Files
          # Keep the committed archive aside for the content comparison below.
          if [ -f LipSync_Firmware.zip ]; then
            mv LipSync_Firmware.zip LipSync_Firmware.zip.committed
          fi
          # (4.5.7 review) Rebuild the archive from scratch: `zip -r` only
          # adds/updates entries, so a file deleted or renamed from the tree
          # lived on in the committed zip forever.
          rm -f LipSync_Firmware.zip.new
          # Include every source needed by the pinned build. Packaging only
          # the sketch silently dropped the bounded Wire/pressure forks, the
          # Bluefruit fault capture, and XENSIV—the resulting download did not
          # reproduce CI or the release binary.
          # (4.9.7 review) Pin every mtime first so the archive bytes are a
          # function of content alone (guard 1 — see the header comment).
          find LipSync_Firmware Libraries -exec touch -t 198001010000.00 {} +
          zip -r -X LipSync_Firmware.zip.new LipSync_Firmware Libraries \
            -x '*/.DS_Store'
          # (4.9.7 review) Replace the committed archive only when its entry
          # CONTENTS changed (guard 2). On "already current" the committed
          # bytes go back untouched, so git sees no change and the commit
          # step below exits without a bot commit.
          python3 - <<'PY'
          import os
          import shutil
          import sys
          import zipfile

          def entry_contents(path):
              with zipfile.ZipFile(path) as z:
                  names = [n for n in z.namelist() if not n.endswith('/')]
                  if len(names) != len(set(names)):
                      sys.exit('duplicate entries in ' + path)
                  return {n: z.read(n) for n in names}

          new = entry_contents('LipSync_Firmware.zip.new')
          changed = True
          if os.path.exists('LipSync_Firmware.zip.committed'):
              try:
                  changed = entry_contents('LipSync_Firmware.zip.committed') != new
              except (zipfile.BadZipFile, OSError):
                  changed = True  # unreadable committed archive: replace it
          if changed:
              if os.path.exists('LipSync_Firmware.zip'):
                  os.remove('LipSync_Firmware.zip')
              shutil.move('LipSync_Firmware.zip.new', 'LipSync_Firmware.zip')
              print('Firmware source archive content changed.')
          else:
              shutil.move('LipSync_Firmware.zip.committed', 'LipSync_Firmware.zip')
              os.remove('LipSync_Firmware.zip.new')
              print('Firmware source archive is already current.')
          PY
          rm -f LipSync_Firmware.zip.committed

      - name: Commit and Push ZIP
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add Build_Files/Firmware_Files/LipSync_Firmware.zip
          if git diff --cached --quiet; then
            echo "Firmware source archive is already current."
            exit 0
          fi
          git commit -m "Automated update: Compress firmware files"
          # (4.9.7 review, follow-up) Push-failure handling is
          # failure-mode-specific — and 4.9.9 round 2 makes the exit status
          # specific too, so only the documented case can masquerade as
          # success:
          #   - a genuine protected-branch refusal (GH006) is the documented
          #     tolerate-and-warn case: name it and exit green, pointing at
          #     the tag-day backstop;
          #   - a non-fast-forward means a human push landed while this run
          #     was building the archive (the concurrency group serializes
          #     workflow runs, not human pushes) — one rebase-and-retry
          #     covers that race; if the retry ALSO fails, exit red (an
          #     exhausted retry is not a tolerated drift);
          #   - anything else (auth, read-only token, network) exits red:
          #     a green job must mean the ZIP is current or the drift is the
          #     named GH006 case, never an undisclosed failure.
          # The fail-closed source-ZIP gate in build_firmware.yml still
          # refuses any release built from a stale tracked ZIP, so tag day
          # cannot silently publish one.
          PUSH_OUT=$(git push 2>&1) || {
            echo "$PUSH_OUT"
            if echo "$PUSH_OUT" | grep -q 'GH006'; then
              echo "::warning title=Source ZIP not updated::Push refused by branch protection (GH006). The refreshed archive exists only on this runner — refresh it manually from an allowed branch before tagging. build_firmware.yml will refuse a release whose tracked ZIP does not match the tagged tree."
              exit 0
            fi
            if echo "$PUSH_OUT" | grep -qiE 'fast-forward|fetch first|rejected|behind'; then
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
                if RETRY_OUT=$(git push 2>&1); then
                  echo "Firmware source ZIP pushed after the rebase retry."
                  exit 0
                fi
                echo "$RETRY_OUT"
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "::error title=Source ZIP not updated::Push failed after the rebase retry (see the log above). The refreshed archive exists only on this runner — refresh it manually before tagging. build_firmware.yml will refuse a release whose tracked ZIP does not match the tagged tree."
              exit 1
            fi
            echo "::error title=Source ZIP not updated::Push failed (not the documented GH006 case — see the log above). The refreshed archive exists only on this runner — refresh it manually before tagging. build_firmware.yml will refuse a release whose tracked ZIP does not match the tagged tree."
            exit 1
          }
