name: Compress Firmware Files

on:
  push:
    branches:
      - '**' # Runs on ALL branches (the v4.1 double-fire caller was removed — 4.5.7 review)
    paths:
      - "Build_Files/Firmware_Files/LipSync_Firmware/**"
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  compress_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Zip Firmware Files
        run: |
          # (4.5.7 review) Rebuild the archive from scratch: `zip -r` only
          # adds/updates entries, so a file deleted or renamed from the tree
          # lived on in the committed zip forever.
          rm -f Build_Files/Firmware_Files/LipSync_Firmware.zip
          cd Build_Files/Firmware_Files/LipSync_Firmware
          zip -r ../LipSync_Firmware.zip ./

      - name: Commit and Push ZIP
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add Build_Files/Firmware_Files/LipSync_Firmware.zip
          git commit -m "Automated update: Compress firmware files"
          git push
