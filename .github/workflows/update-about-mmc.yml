name: Update About MMC Section
# This GitHub Action will update the About Makers Making Change section of the Readme.md
# from the Makers-Making-Change repository readme.

# It replace everything in the Readme.md file between the tags <!-- ABOUT MMC START --> and
# <!-- ABOUT MMC END -->

# It is triggered manually through the GitHub Actions in the repository.
# Last updated: 2025-Apr-08
on:
  workflow_dispatch:  # Enables manual trigger via the Actions tab

jobs:
  update-about:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch shared About MMC section
        run: |
          curl --silent --show-error --location --fail \
            https://raw.githubusercontent.com/makersmakingchange/Makers-Making-Change/refs/heads/main/README.md \
            -o about.md

      - name: Replace About MMC section in README
        run: |
          if [ ! -f README.md ]; then
            echo "README.md not found!"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          start = '<!-- ABOUT MMC START -->'
          end = '<!-- ABOUT MMC END -->'
          readme = Path('README.md').read_text()
          shared = Path('about.md').read_text()

          if readme.count(start) != 1 or readme.count(end) != 1:
              raise SystemExit('README.md must contain exactly one About MMC marker pair')

          match = re.search(r'<!-- ABOUT MMC START\s*-->(.*?)<!-- ABOUT MMC END\s*-->', shared, re.S)
          if not match or not match.group(1).strip():
              raise SystemExit('Downloaded README did not contain a non-empty About MMC section')

          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)
          replacement = f'{start}\n{match.group(1).strip()}\n{end}'
          Path('README.md').write_text(before + replacement + after)
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md
          git diff --cached --quiet || (git commit -m "Update About MMC Section" && git push)
